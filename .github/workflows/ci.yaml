name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v5.0.0

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v5.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm i --frozen-lockfile

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-browsers-

      - if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: component-screenshots
          path: __screenshots__/
          retention-days: 90

      - name: Visual Regression Test
        uses: reg-viz/reg-actions@v2
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          image-directory-path: './__screenshots__'
          outdated-comment-action: 'minimize'
          enable-antialias: true
          retention-days: 90
          threshold-pixel: 40
